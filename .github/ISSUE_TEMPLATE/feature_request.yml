name: Feature request
description: Suggest a new capability or an improvement
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - api
        - web
        - both
        - infrastructure / tooling
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the problem, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
